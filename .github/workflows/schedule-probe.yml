# =============================================================================
# 临时调度探针（实验用，验证完立即删除）
# =============================================================================
#
# 目的：区分「账号级限制」与「单仓库问题」。
#
#   H2orange/checkin_actions 配了 schedule 但 schedule 触发次数为 0，
#   而手动 workflow_dispatch 正常。本仓库与之同属 H2orange 账号，
#   但宿主信息不同（本仓库是 public），因此在默认分支放同样的探针：
#
#     本仓库能出 schedule run  → 账号调度正常，问题只出在 checkin_actions
#     本仓库也不出 schedule run → 账号级限制成立，需联系 GitHub Support
#
# 本探针不依赖任何 Secret、不读写任何数据、不产生任何副作用。
# =============================================================================

name: Schedule Probe (temp)

on:
  schedule:
    # 每 10 分钟一个观察窗口，便于快速定性（验证完删除本文件）
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 报告触发来源
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 触发来源与时间
        run: |
          set -euo pipefail
          echo "event    : ${{ github.event_name }}"
          echo "cron     : ${{ github.event.schedule }}"
          echo "repo     : ${{ github.repository }}"
          echo "UTC      : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间 : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ 定时调度在本仓库生效"
          else
            echo "ℹ️ 手动触发（对照组）"
          fi
